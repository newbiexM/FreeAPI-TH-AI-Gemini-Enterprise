[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeapi-th-ai-gemini-enterprise"
version = "0.1.0"
description = "Free OpenAI and Anthropic compatible API bridge for Gemini Enterprise via TH-AI Passport"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Timothy Pratumrut / Yeet2042" }]
dependencies = []

[project.scripts]
freeapi-bridge = "hermes_aipass.bridge:main"
aipass-bridge = "hermes_aipass.bridge:main"
hermes-aipass = "hermes_aipass.cli:main"


[tool.setuptools.packages.find]
include = ["hermes_aipass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = [".", "hermes_aipass", "tests"]
extraPaths = [".", "hermes_aipass"]


