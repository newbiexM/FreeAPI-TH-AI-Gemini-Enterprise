[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-aipass"
version = "0.1.0"
description = "AiPASS model-provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yeet2042" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["hermes_aipass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

